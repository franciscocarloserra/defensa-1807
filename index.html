<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Buenos Aires 1806–1810</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#ddd;font:14px system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#1a1a1a}
header h1{font-size:14px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{background:#2a2a2a;color:#ddd;border:1px solid #444;border-radius:6px;padding:8px 12px;font:inherit}
#wrap{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#bar{padding:8px 56px 8px 10px;background:#1a1a1a;min-height:2.8em;font-size:13px;line-height:1.4}
#overlay{position:fixed;inset:0;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;line-height:1.5}
#overlay.hidden{display:none}
#ovtext{max-height:72vh;overflow:auto;max-width:34em}
#ovtext.doc{text-align:left}
#ovtext h2{margin:0 0 6px;font-size:20px}#ovtext h3{margin:16px 0 2px;font-size:15px}#ovtext p{margin:6px 0}
#ovtext .date{color:#b9a77f;margin-top:0}#ovtext .src{color:#888;font-size:12px;margin-top:14px}
#ovbtns{display:flex;flex-direction:column;gap:8px;width:min(100%,22em)}
button:disabled{opacity:.4}
#bar a{color:#f3d58a;text-decoration:underline;cursor:pointer}
#mute{position:fixed;right:10px;bottom:10px;z-index:10;padding:6px 10px;font-size:18px;line-height:1}
</style>
</head>
<body>
<header><button id="menu">☰</button><h1 id="turn"></h1><button id="help">?</button><button id="end">Fin turno</button></header>
<div id="wrap"><canvas id="map"></canvas></div>
<div id="bar"></div>
<button id="mute" aria-label="Música"></button>
<div id="overlay" class="hidden"><div id="ovtext"></div><div id="ovbtns"></div></div>
<script src="src/dev/telemetry.js"></script>
<script src="src/rules/rules.js"></script>
<script src="src/rules/story.js"></script>
<script src="src/engine/engine.js"></script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/controls/OrbitControls.js":"./vendor/OrbitControls.js","three/addons/loaders/GLTFLoader.js":"./vendor/GLTFLoader.js","three/addons/objects/Water.js":"./vendor/Water.js"}}</script>
<script src="src/audio/music.js"></script>
<script type="module" src="src/render/render3d.js"></script>
</body>
</html>
